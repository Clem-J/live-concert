<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Concert — Watch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Live Concert</h1>
    <p>Spectateur</p>
  </header>

  <div class="video-wrapper">
    <video id="remote-video" autoplay playsinline muted></video>
    <span class="live-badge" id="live-badge">● LIVE</span>
    <div class="offline-msg" id="offline-msg">En attente du stream...</div>
    <button class="btn-unmute" id="btn-unmute" hidden>🔇 Cliquer pour activer le son</button>
  </div>

  <div class="controls">
    <span class="status" id="status">Connexion au serveur...</span>
  </div>

  <script src="https://static.opentok.com/v2/js/opentok.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="adapters/SignalingAdapter.js"></script>
  <script src="adapters/P2PAdapter.js"></script>
  <script src="adapters/VonageAdapter.js"></script>
  <script src="adapters/index.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
